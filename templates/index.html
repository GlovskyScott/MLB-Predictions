<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MLB Predictions — Edge</title>
<link rel="preconnect" href="https://a.espncdn.com">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; -webkit-font-smoothing: antialiased; background: #08090c; color: #eef0f4; }
  .num { font-variant-numeric: tabular-nums; }
  .app-scroll::-webkit-scrollbar { width: 0; }
  .tap { cursor: pointer; transition: background .12s, opacity .12s, color .12s; }
  .tap:hover { background: #13161d; }
  img.logo { object-fit: contain; flex-shrink: 0; display: inline-block; vertical-align: middle; }
  input, button { font-family: inherit; }
</style>
</head>
<body>
<script id="payload" type="application/json">{{ payload|tojson }}</script>

<div style="min-height:100vh;background:#08090c;display:flex;justify-content:center;">
  <div class="app-scroll" style="width:100%;max-width:540px;min-height:100vh;background:#0b0d11;border-left:1px solid #15181f;border-right:1px solid #15181f;display:flex;flex-direction:column;">

    <!-- HEADER -->
    <div id="appHeader" style="position:sticky;top:0;z-index:20;background:rgba(11,13,17,.86);backdrop-filter:blur(12px);border-bottom:1px solid #161a22;">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:18px 18px 0;">
        <div style="display:flex;align-items:baseline;gap:9px;">
          <span style="font:800 18px system-ui;color:#f1f3f6;letter-spacing:-.3px;">MLB Predictions</span>
          <span id="dateLabel" style="font:500 12px system-ui;color:#646a76;"></span>
        </div>
      </div>
      <div id="tabs"></div>
    </div>

    <div id="screen"></div>
  </div>
</div>

<script>
const ACCENT = '#3b82f6', EDGE = '#34d399';
const DATA = JSON.parse(document.getElementById('payload').textContent);
const state = { tab: 'today', openId: null, sort: 'edge', innView: 'both', showLineups: false };
let tomorrowGames = null;   // null = not fetched, 'loading' = in-flight, array = ready
let tomorrowDateLabel = '';

/* ---------- helpers ---------- */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function img(url, size) { return url ? `<img class="logo" src="${esc(url)}" alt="" loading="lazy" style="width:${size}px;height:${size}px;">` : ''; }
function fmtTime(utc) { if (!utc) return 'TBD'; const d = new Date(utc); if (isNaN(d.getTime())) return 'TBD'; return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
function gameById(id) { return DATA.games.find(g => g.id === id) || (Array.isArray(tomorrowGames) ? tomorrowGames.find(g => g.id === id) : null); }
function probToML(p) { p = Math.min(0.95, Math.max(0.04, p)); return p >= 0.5 ? '-' + Math.round(p / (1 - p) * 100) : '+' + Math.round((1 - p) / p * 100); }
function sortedGames() {
  const gs = [...DATA.games];
  gs.sort((a, b) => state.sort === 'time' ? (a.utc || '~').localeCompare(b.utc || '~') : (b.edgePct - a.edgePct));
  return gs;
}

/* ---------- header tabs ---------- */
function renderHeader() {
  document.getElementById('dateLabel').textContent = (state.tab === 'tomorrow' && tomorrowDateLabel) ? tomorrowDateLabel : (DATA.dateLabel || '');
  const tabsEl = document.getElementById('tabs');
  // In the game drill-down the tabs are hidden, so drop the header's bottom
  // border — otherwise it reads as a stray line under the title — and add a
  // little bottom padding the tab row would otherwise provide, so the sticky
  // header doesn't crowd the content scrolling beneath it.
  const hdr = document.getElementById('appHeader');
  const detail = state.openId !== null;
  hdr.style.borderBottom = detail ? 'none' : '1px solid #161a22';
  hdr.style.paddingBottom = detail ? '10px' : '0';
  if (detail) { tabsEl.innerHTML = ''; return; }
  const tab = (key, label) => {
    const on = state.tab === key;
    return `<div class="tap" data-tab="${key}" style="padding-bottom:11px;font:600 13.5px system-ui;color:${on ? '#f1f3f6' : '#5b616d'};border-bottom:2px solid ${on ? ACCENT : 'transparent'};">${label}</div>`;
  };
  tabsEl.innerHTML = `<div style="display:flex;gap:20px;padding:16px 18px 0;overflow-x:auto;scrollbar-width:none;">${tab('today', 'Today')}${tab('tomorrow', 'Tomorrow')}${tab('salami', 'Salami')}${tab('track', 'Record')}${tab('settings', 'Settings')}</div>`;
  tabsEl.querySelectorAll('[data-tab]').forEach(el => el.onclick = () => {
    state.tab = el.dataset.tab;
    if (el.dataset.tab === 'tomorrow' && tomorrowGames === null) {
      tomorrowGames = 'loading';
      render();
      fetch('/api/games/tomorrow')
        .then(r => r.json())
        .then(data => { tomorrowGames = data.games; tomorrowDateLabel = data.dateLabel; if (state.tab === 'tomorrow') render(false); })
        .catch(() => { tomorrowGames = []; if (state.tab === 'tomorrow') render(false); });
      return;
    }
    render();
  });
}

/* ---------- TODAY ---------- */
function todayRow(g, edge) {
  if (edge) {
    return `<div class="tap" data-open="${g.id}" style="display:flex;align-items:center;gap:12px;padding:11px 8px;border-radius:12px;">
      <div class="num" style="min-width:52px;text-align:center;font:800 19px system-ui;color:${EDGE};letter-spacing:-.5px;">+${g.edgePct}%</div>
      <div style="flex:1;min-width:0;">
        <div style="display:flex;align-items:center;gap:7px;font:700 14px system-ui;color:#eef0f4;">${img(g.awayLogo, 19)}${esc(g.away)}<span style="color:#4d525d;font-weight:500;">@</span>${img(g.homeLogo, 19)}${esc(g.home)}</div>
        <div style="margin-top:3px;font:500 11.5px system-ui;color:#737a86;">Take <span style="color:#aeb4c0;font-weight:700;">${esc(g.pick)} ${g.pickPct}%</span> · proj ${esc(g.score)}</div>
      </div>
      <div style="text-align:right;flex-shrink:0;">
        <div class="num" style="font:600 11.5px system-ui;color:#7c828e;">${fmtTime(g.utc)}</div>
        <div style="margin-top:3px;font:600 11px system-ui;color:${ACCENT};">Detail ›</div>
      </div></div>`;
  }
  return `<div class="tap" data-open="${g.id}" style="display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:12px;opacity:.64;">
    <div style="min-width:52px;text-align:center;font:600 15px system-ui;color:#454a55;">—</div>
    <div style="flex:1;min-width:0;">
      <div style="display:flex;align-items:center;gap:7px;font:700 13.5px system-ui;color:#c2c6cf;">${img(g.awayLogo, 18)}${esc(g.away)}<span style="color:#4d525d;font-weight:500;">@</span>${img(g.homeLogo, 18)}${esc(g.home)}</div>
      <div style="margin-top:2px;font:500 11px system-ui;color:#646a76;">Lean ${esc(g.pick)} ${g.pickPct}% · proj ${esc(g.score)}</div>
    </div>
    <div class="num" style="font:600 11px system-ui;color:#646a76;flex-shrink:0;">${fmtTime(g.utc)}</div></div>`;
}
function renderToday() {
  const gs = sortedGames();
  const edges = gs.filter(g => g.hasEdge), none = gs.filter(g => !g.hasEdge);
  const seg = (on, key, label) => `<div class="tap" data-sort="${key}" style="padding:4px 10px;border-radius:6px;font:600 11px system-ui;color:${on ? '#f1f3f6' : '#646a76'};background:${on ? '#222834' : 'transparent'};">${label}</div>`;
  let html = `<div style="padding:0 10px 40px;">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 8px 6px;">
      <div style="display:flex;align-items:center;gap:7px;color:#6b7280;font:500 11.5px system-ui;">
        <span style="width:6px;height:6px;border-radius:50%;background:${EDGE};display:inline-block;"></span>
        <span style="color:#cfd3da;font-weight:700;">${DATA.accAccuracy}% hit rate on moneyline</span>&nbsp;last 7 days
      </div>
      <div style="display:flex;background:#13161d;border:1px solid #1e222b;border-radius:8px;padding:2px;">${seg(state.sort === 'edge', 'edge', 'Edge')}${seg(state.sort === 'time', 'time', 'Time')}</div>
    </div>`;
  if (!gs.length) {
    html += `<div style="padding:40px 12px;text-align:center;color:#646a76;font:500 13px system-ui;">No games scheduled today.</div>`;
  } else {
    html += `<div style="font:700 10px system-ui;letter-spacing:1.4px;color:#565c68;text-transform:uppercase;padding:8px 8px 6px;">Best edges today</div>`;
    html += edges.length ? edges.map(g => todayRow(g, true)).join('') : `<div style="padding:6px 10px;color:#565c68;font:500 12px system-ui;">No edges vs the market today.</div>`;
    if (none.length) {
      html += `<div style="font:700 10px system-ui;letter-spacing:1.4px;color:#3f444e;text-transform:uppercase;padding:18px 8px 6px;">No edge — model agrees with market</div>`;
      html += none.map(g => todayRow(g, false)).join('');
    }
  }
  html += `</div>`;
  return html;
}

/* ---------- SALAMI TRACKER ---------- */
function renderSalami() {
  const gs = DATA.games;
  const final = gs.filter(g => g.status === 'Final');
  const live  = gs.filter(g => g.status === 'In Progress' || g.status === 'Game Over');
  const upcoming = gs.filter(g => g.status !== 'Final' && g.status !== 'In Progress' && g.status !== 'Game Over');

  const sum = (arr, fn) => arr.reduce((s, g) => s + (fn(g) || 0), 0);

  // Actual runs scored — only real numbers from finished/live games
  const lockedAway = sum(final, g => g.awayActual);
  const lockedHome = sum(final, g => g.homeActual);
  const locked = lockedAway + lockedHome;

  const liveAway = sum(live, g => g.awayActual);
  const liveHome = sum(live, g => g.homeActual);
  const liveTotal = liveAway + liveHome;

  // Model projection across ALL games — stays constant as games start/finish
  const estAway = sum(gs, g => g.projAway);
  const estHome = sum(gs, g => g.projHome);
  const estTotal = estAway + estHome;

  // Remaining proj (upcoming only) — for sub-line display
  const projAway = sum(upcoming, g => g.projAway);
  const projHome = sum(upcoming, g => g.projHome);
  const proj = projAway + projHome;

  const scored = locked + liveTotal;
  const pct = estTotal > 0 ? Math.round(scored / estTotal * 100) : 0;

  // Running pace: actual runs from finished/live games + projections for remaining
  const paceTotal = scored + proj;
  const delta = paceTotal - estTotal;
  const hasStarted = final.length > 0 || live.length > 0;

  const statCard = (label, val, sub) =>
    `<div style="background:#11141a;border:1px solid #1e222b;border-radius:12px;padding:13px 14px;">
      <div style="font:600 9.5px system-ui;color:#646a76;text-transform:uppercase;letter-spacing:.6px;">${label}</div>
      <div class="num" style="font:800 22px system-ui;color:#f1f3f6;margin-top:6px;letter-spacing:-.5px;">${val}</div>
      <div style="font:500 10px system-ui;color:#737a86;margin-top:2px;line-height:1.4;">${sub}</div>
    </div>`;

  const gameRow = g => {
    const isFinal = g.status === 'Final';
    const isLive  = g.status === 'In Progress' || g.status === 'Game Over';
    const icon = isFinal ? '✓' : isLive ? '⚡' : '·';
    const iconColor = isFinal ? '#4caf50' : isLive ? '#facc15' : '#4d525d';
    const nameColor = isFinal ? '#8a909c' : isLive ? '#eef0f4' : '#646a76';
    let matchup, runLabel, runColor;
    if (isFinal) {
      matchup = `${esc(g.away)} ${g.awayActual}–${g.homeActual} ${esc(g.home)}`;
      runLabel = `${(g.awayActual||0)+(g.homeActual||0)} runs`;
      runColor = '#c2c6cf';
    } else if (isLive) {
      matchup = `${esc(g.away)} ${g.awayActual}–${g.homeActual} ${esc(g.home)}`;
      runLabel = `${(g.awayActual||0)+(g.homeActual||0)}+ live`;
      runColor = '#facc15';
    } else {
      matchup = `${esc(g.away)} @ ${esc(g.home)}`;
      runLabel = `proj ${(g.projAway||0)+(g.projHome||0)}`;
      runColor = '#4d525d';
    }
    const sub = isFinal ? '' : isLive ? 'In progress' : fmtTime(g.utc);
    return `<div style="display:flex;align-items:center;gap:10px;padding:10px 4px;border-top:1px solid #15181f;">
      <div style="width:14px;text-align:center;font:700 11px system-ui;color:${iconColor};">${icon}</div>
      <div style="flex:1;min-width:0;">
        <div style="font:600 12.5px system-ui;color:${nameColor};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${matchup}</div>
        ${sub ? `<div style="font:500 10px system-ui;color:#565c68;margin-top:1px;">${sub}</div>` : ''}
      </div>
      <div class="num" style="font:700 11.5px system-ui;color:${runColor};flex-shrink:0;">${runLabel}</div>
    </div>`;
  };

  const sorted = [
    ...final.sort((a,b)=>(a.utc||'').localeCompare(b.utc||'')),
    ...live.sort((a,b)=>(a.utc||'').localeCompare(b.utc||'')),
    ...upcoming.sort((a,b)=>(a.utc||'~').localeCompare(b.utc||'~')),
  ];

  const awaySubLine = [
    lockedAway ? `${lockedAway} final` : '',
    liveAway   ? `${liveAway}+ live` : '',
    projAway   ? `+${projAway} proj` : '',
  ].filter(Boolean).join(' · ') || 'no runs yet';
  const homeSubLine = [
    lockedHome ? `${lockedHome} final` : '',
    liveHome   ? `${liveHome}+ live` : '',
    projHome   ? `+${projHome} proj` : '',
  ].filter(Boolean).join(' · ') || 'no runs yet';

  return `<div style="padding:14px 16px 48px;">
    <div style="font:700 10px system-ui;letter-spacing:1.4px;color:#565c68;text-transform:uppercase;padding:0 2px 12px;">Grand Salami</div>

    <div style="background:#11141a;border:1px solid #1e222b;border-radius:14px;padding:16px;margin-bottom:14px;">
      <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:8px;">
        <div>
          <div style="font:600 10px system-ui;color:#646a76;text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px;">Runs scored</div>
          <div style="display:flex;align-items:baseline;gap:8px;">
            <div class="num" style="font:800 48px system-ui;color:#f1f3f6;letter-spacing:-2px;">${scored}</div>
            ${liveTotal ? `<div style="font:700 13px system-ui;color:#facc15;">+${liveTotal} live</div>` : ''}
          </div>
        </div>
        <div style="text-align:right;padding-bottom:6px;">
          <div style="font:600 10px system-ui;color:#565c68;text-transform:uppercase;letter-spacing:.6px;margin-bottom:3px;">Est. total</div>
          <div class="num" style="font:700 22px system-ui;color:#737a86;">${estTotal}</div>
        </div>
      </div>
      <div style="margin-top:14px;">
        <div style="height:6px;border-radius:4px;background:#15181f;overflow:hidden;">
          <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,#4caf50,#34d399);border-radius:4px;transition:width .4s;"></div>
        </div>
        <div style="display:flex;justify-content:space-between;margin-top:5px;font:500 10px system-ui;color:#4d525d;">
          <span>${pct}% of estimated total scored</span>
          <span>${final.length} final · ${live.length} live · ${upcoming.length} upcoming</span>
        </div>
        ${hasStarted ? (() => {
          const absDelta = Math.abs(delta);
          const isOver = delta > 0;
          const isUnder = delta < 0;
          const label = isOver ? `OVER +${absDelta}` : isUnder ? `UNDER −${absDelta}` : 'ON PACE';
          const bg   = isOver ? 'rgba(52,211,153,.13)' : isUnder ? 'rgba(239,83,80,.13)' : 'rgba(255,255,255,.05)';
          const col  = isOver ? '#34d399' : isUnder ? '#ef5350' : '#737a86';
          return `<div style="display:flex;align-items:center;gap:8px;margin-top:10px;">
            <span style="font:800 11px system-ui;letter-spacing:.6px;padding:4px 11px;border-radius:20px;background:${bg};color:${col};">${label}</span>
            <span style="font:500 10px system-ui;color:#4d525d;">vs model est. ${estTotal} runs</span>
          </div>`;
        })() : ''}
      </div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:20px;">
      ${statCard('Away Runs', lockedAway + liveAway, awaySubLine)}
      ${statCard('Home Runs', lockedHome + liveHome, homeSubLine)}
      ${statCard('Est. Total', estTotal, `${scored} scored · +${proj} proj`)}
    </div>

    <div style="font:700 10px system-ui;letter-spacing:1.4px;color:#565c68;text-transform:uppercase;padding:0 2px 6px;">Today's Games</div>
    <div style="background:#11141a;border:1px solid #1e222b;border-radius:14px;padding:4px 12px;">
      ${sorted.map(gameRow).join('') || '<div style="padding:16px 4px;color:#565c68;font:500 12px system-ui;">No games today.</div>'}
    </div>
  </div>`;
}

/* ---------- TOMORROW ---------- */
function sortedTomorrowGames() {
  const gs = [...(Array.isArray(tomorrowGames) ? tomorrowGames : [])];
  gs.sort((a, b) => state.sort === 'time' ? (a.utc || '~').localeCompare(b.utc || '~') : (b.edgePct - a.edgePct));
  return gs;
}
function renderTomorrow() {
  if (tomorrowGames === null || tomorrowGames === 'loading') {
    return `<div style="padding:60px 18px;text-align:center;color:#646a76;font:500 13px system-ui;">Loading tomorrow's games…</div>`;
  }
  const gs = sortedTomorrowGames();
  const edges = gs.filter(g => g.hasEdge), none = gs.filter(g => !g.hasEdge);
  const seg = (on, key, label) => `<div class="tap" data-sort="${key}" style="padding:4px 10px;border-radius:6px;font:600 11px system-ui;color:${on ? '#f1f3f6' : '#646a76'};background:${on ? '#222834' : 'transparent'};">${label}</div>`;
  let html = `<div style="padding:0 10px 40px;">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 8px 6px;">
      <div style="display:flex;align-items:center;gap:7px;color:#6b7280;font:500 11.5px system-ui;">
        <span style="width:6px;height:6px;border-radius:50%;background:${EDGE};display:inline-block;"></span>
        <span style="color:#cfd3da;font-weight:700;">${DATA.accAccuracy}% hit rate on moneyline</span>&nbsp;last 7 days
      </div>
      <div style="display:flex;background:#13161d;border:1px solid #1e222b;border-radius:8px;padding:2px;">${seg(state.sort === 'edge', 'edge', 'Edge')}${seg(state.sort === 'time', 'time', 'Time')}</div>
    </div>`;
  if (!gs.length) {
    html += `<div style="padding:40px 12px;text-align:center;color:#646a76;font:500 13px system-ui;">No games scheduled tomorrow.</div>`;
  } else {
    html += `<div style="font:700 10px system-ui;letter-spacing:1.4px;color:#565c68;text-transform:uppercase;padding:8px 8px 6px;">Best edges tomorrow</div>`;
    html += edges.length ? edges.map(g => todayRow(g, true)).join('') : `<div style="padding:6px 10px;color:#565c68;font:500 12px system-ui;">No edges vs the market tomorrow.</div>`;
    if (none.length) {
      html += `<div style="font:700 10px system-ui;letter-spacing:1.4px;color:#3f444e;text-transform:uppercase;padding:18px 8px 6px;">No edge — model agrees with market</div>`;
      html += none.map(g => todayRow(g, false)).join('');
    }
  }
  html += `</div>`;
  return html;
}

/* ---------- TRACK RECORD ---------- */
function renderTrack() {
  const t = DATA.track;
  const card = s => `<div style="background:#11141a;border:1px solid #1e222b;border-radius:13px;padding:14px;">
    <div style="font:600 10.5px system-ui;color:#646a76;text-transform:uppercase;letter-spacing:.6px;">${esc(s.label)}</div>
    <div class="num" style="font:800 26px system-ui;color:${s.good ? '#4caf50' : '#e8e8e8'};margin-top:8px;letter-spacing:-1px;">${s.acc}%</div>
    <div style="font:500 11px system-ui;color:#737a86;margin-top:3px;">${s.games} games${s.err != null ? ' · ±' + s.err + ' runs' : ''}</div>
    <div style="font:500 10px system-ui;color:#565c68;margin-top:3px;">Consensus${s.model != null ? ' · model ' + s.model + '%' : ''}</div></div>`;
  const yrow = y => `<div style="display:flex;align-items:center;gap:12px;padding:11px 4px;border-top:1px solid #161a21;">
    <div style="flex:1;min-width:0;display:flex;align-items:center;gap:6px;font:700 13px system-ui;color:#e3e6eb;">${img(y.awayLogo, 18)}${esc(y.away)}<span style="color:#4d525d;font-weight:500;">@</span>${img(y.homeLogo, 18)}${esc(y.home)}</div>
    <div style="text-align:right;"><div class="num" style="font:700 13px system-ui;color:#dfe2e8;">${esc(y.actual)}</div><div style="font:500 10px system-ui;color:#646a76;margin-top:1px;">pick ${esc(y.pick)}</div></div>
    <div style="min-width:54px;text-align:center;"><span style="font:800 10.5px system-ui;padding:3px 9px;border-radius:20px;color:${y.win ? '#4caf50' : '#ef5350'};background:${y.win ? 'rgba(76,175,80,.14)' : 'rgba(239,83,80,.14)'};">${y.win ? '✓ HIT' : '✗ MISS'}</span></div></div>`;
  const drow = d => `<div style="display:flex;align-items:center;gap:12px;padding:8px 4px;">
    <div style="width:54px;font:500 11.5px system-ui;color:#9aa0ac;">${esc(d.date)}</div>
    <div style="width:62px;font:500 11px system-ui;color:#646a76;">${d.n} games</div>
    <div style="flex:1;height:7px;border-radius:4px;background:#15181f;overflow:hidden;"><div style="height:100%;width:${d.acc}%;background:${d.acc >= 60 ? '#4caf50' : '#5a6270'};border-radius:4px;"></div></div>
    <div class="num" style="width:38px;text-align:right;font:700 12px system-ui;color:${d.acc >= 60 ? '#4caf50' : '#c2c6cf'};">${d.acc}%</div></div>`;
  let html = `<div style="padding:16px 16px 40px;">
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:20px;">${t.summary.map(card).join('')}</div>
    <div style="font:700 10px system-ui;letter-spacing:1.4px;color:#565c68;text-transform:uppercase;padding:0 2px 8px;">Yesterday · ${esc(t.yDate)}</div>`;
  html += t.yesterday.length ? t.yesterday.map(yrow).join('') : `<div style="padding:6px 4px;color:#565c68;font:500 12px system-ui;">No graded games yet.</div>`;
  html += `<div style="font:700 10px system-ui;letter-spacing:1.4px;color:#565c68;text-transform:uppercase;padding:22px 2px 8px;">Daily accuracy · last 7 days</div>`;
  html += t.daily.length ? t.daily.map(drow).join('') : `<div style="padding:6px 4px;color:#565c68;font:500 12px system-ui;">Building history…</div>`;
  html += `<a href="/history" style="text-decoration:none;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#11141a;border:1px solid #1e222b;border-radius:13px;padding:14px 16px;margin-top:24px;">
    <div><div style="font:600 13px system-ui;color:#eef0f4;">All past games &amp; closing lines</div>
    <div style="font:500 11px system-ui;color:#737a86;margin-top:3px;">Every result with the model's pick, graded against the real closing line.</div></div>
    <span style="font:600 13px system-ui;color:${ACCENT};white-space:nowrap;">Open ›</span></a>`;
  html += `</div>`;
  return html;
}

/* ---------- GAME DETAIL ---------- */
function distRow(abbr, logo, counts, labels, color) {
  const n = Math.min(labels.length, 13);
  const slice = counts.slice(0, n);
  const max = Math.max(1, ...slice);
  const modal = slice.indexOf(Math.max(...slice));
  const total = slice.reduce((a, b) => a + b, 0) || 1;
  const bars = slice.map((c, k) => `<div title="${labels[k]} runs · ${Math.round(c / total * 100)}%" style="flex:1;height:${Math.max(3, c / max * 100)}%;min-height:2px;background:${k === modal ? color : color + '66'};border-radius:2px;"></div>`).join('');
  return `<div style="display:flex;align-items:flex-end;gap:8px;margin-bottom:10px;">
    <div style="width:42px;display:flex;align-items:center;gap:5px;font:700 12px system-ui;color:#dfe2e8;">${img(logo, 16)}${esc(abbr)}</div>
    <div style="flex:1;display:flex;align-items:flex-end;gap:3px;height:48px;">${bars}</div></div>`;
}
function renderDetail() {
  const g = gameById(state.openId);
  if (!g) { state.openId = null; return renderToday(); }
  const betPctColor = g.hasEdge ? EDGE : '#7c828e';
  const betHeadline = g.hasEdge ? `+${g.edgePct}%` : '—';
  const betLine = g.hasEdge ? `Take ${esc(g.pick)} moneyline` : `Lean ${esc(g.pick)}, no edge`;
  // hasEdge: an AI edge angle fills in async (fetchEdge); show the deterministic
  // consensus line as the fallback until it arrives (and if Ollama is down).

          <div style="display:flex;justify-content:space-between;font:700 11.5px system-ui;margin-bottom:5px;"><span class="num" style="color:#dfe2e8;">${g.awayPct}%</span><span style="color:#646a76;font-weight:500;">win probability</span><span class="num" style="color:#dfe2e8;">${g.homePct}%</span></div>
          <div style="height:8px;border-radius:5px;overflow:hidden;display:flex;background:#0a0c10;"><div style="width:${g.awayPct}%;background:${g.awayColor};"></div><div style="width:${g.homePct}%;background:${g.homeColor};"></div></div>

          <div style="padding:11px 14px;border-right:1px solid #1c2029;"><div style="font:600 9.5px system-ui;color:#646a76;text-transform:uppercase;letter-spacing:.6px;">Market</div><div class="num" style="font:700 13px system-ui;color:#e6ad62;margin-top:4px;">${esc(g.pick)} ${esc(g.marketML || '—')}</div></div>
          <div style="padding:11px 14px;"><div style="font:600 9.5px system-ui;color:#646a76;text-transform:uppercase;letter-spacing:.6px;">Edge</div><div class="num" style="font:700 13px system-ui;color:${g.hasEdge ? EDGE : '#646a76'};margin-top:4px;">${g.hasEdge ? '+' + g.edgePct + '%' : 'none'}</div></div>

      <div style="background:#11141a;border:1px solid #1e222b;border-radius:14px;padding:14px 14px 10px;">
        ${distRow(g.away, g.awayLogo, g.scoreDist.away, labels, g.awayColor)}
        ${distRow(g.home, g.homeLogo, g.scoreDist.home, labels, g.homeColor)}
        <div style="display:flex;align-items:center;gap:8px;"><div style="width:42px;"></div><div style="flex:1;display:flex;gap:3px;">${axis}</div></div>
        <div style="font:500 10px system-ui;color:#5a606b;text-align:center;padding-top:8px;">runs scored · ${(g.nSims || 0).toLocaleString()} simulations · tallest bar = most likely</div>

        <span style="font:700 10px system-ui;letter-spacing:1.4px;color:#565c68;text-transform:uppercase;">Inning moneylines</span>
        <div style="display:flex;background:#13161d;border:1px solid #1e222b;border-radius:8px;padding:2px;">${innSeg(state.innView === 'away', 'away', g.away)}${innSeg(state.innView === 'home', 'home', g.home)}${innSeg(state.innView === 'both', 'both', 'Both')}</div>

      <div style="background:#11141a;border:1px solid #1e222b;border-radius:14px;padding:6px 14px 8px;">
        <div style="display:flex;align-items:center;gap:8px;padding:8px 0;"><div style="width:40px;font:600 9.5px system-ui;color:#646a76;text-transform:uppercase;letter-spacing:.6px;">Inn</div><div style="flex:1;text-align:right;font:600 9.5px system-ui;color:#646a76;text-transform:uppercase;letter-spacing:.6px;">0 runs</div><div style="flex:1;text-align:right;font:600 9.5px system-ui;color:#646a76;text-transform:uppercase;letter-spacing:.6px;">1 run</div><div style="flex:1;text-align:right;font:600 9.5px system-ui;color:#646a76;text-transform:uppercase;letter-spacing:.6px;">2+ runs</div></div>
        ${innRows || '<div style="padding:8px 0;color:#565c68;font:500 12px system-ui;">No inning data.</div>'}
        <div style="font:500 10px system-ui;color:#5a606b;text-align:center;padding-top:8px;">fair moneyline to score exactly 0 / 1 / 2+ runs in each inning</div>

/* ---------- main render ---------- */
// scrollTop=true on navigation (tab switch, open/close game); pass false for
// in-place toggles (inning view, lineups, sort) so the page doesn't jump.
function render(scrollTop = true) {
  const y = window.scrollY;   // preserve position across in-place re-renders
  renderHeader();
  const screen = document.getElementById('screen');
  if (state.openId !== null) {
    screen.innerHTML = renderDetail();
    wireDetail();
    setExplain(state.openId);   // restore the AI read after the DOM is rebuilt
    setEdge(state.openId);      // restore the AI edge angle in "The bet"
  } else if (state.tab === 'today') {
    screen.innerHTML = renderToday();
    screen.querySelectorAll('[data-open]').forEach(el => el.onclick = () => openGame(+el.dataset.open));
    screen.querySelectorAll('[data-sort]').forEach(el => el.onclick = () => { state.sort = el.dataset.sort; render(false); });
  } else if (state.tab === 'tomorrow') {
    screen.innerHTML = renderTomorrow();
    screen.querySelectorAll('[data-open]').forEach(el => el.onclick = () => openGame(+el.dataset.open));
    screen.querySelectorAll('[data-sort]').forEach(el => el.onclick = () => { state.sort = el.dataset.sort; render(false); });
  } else if (state.tab === 'salami') {
    screen.innerHTML = renderSalami();
  } else if (state.tab === 'track') {
    screen.innerHTML = renderTrack();
  } else {
    screen.innerHTML = renderSettings();
  }
  window.scrollTo(0, scrollTop ? 0 : y);
}
function openGame(id) {
  state.openId = id; state.showLineups = false; state.innView = 'both';
  render();
  const g = gameById(id);
  // Ollama serves one generation at a time on a single-threaded dev server, so
  // stream the short edge angle first, then start the longer AI-read stream.
  if (g && g.hasEdge) streamEdge(id, () => streamExplanation(id));
  else streamExplanation(id);
}
function wireDetail() {
  const g = gameById(state.openId);
  document.getElementById('detailBack').onclick = () => { state.openId = null; render(); };
  document.getElementById('lineupToggle').onclick = () => { state.showLineups = !state.showLineups; render(false); };
  document.querySelectorAll('[data-inn]').forEach(el => el.onclick = () => { state.innView = el.dataset.inn; render(false); });
}

/* ---------- AI edge angle (/edge) ---------- */
// Short (<=12 word) AI angle for "The bet". Buffered per game so it survives
// in-place re-renders; falls back to the deterministic consensus line if empty.
const edgeText = {};   // gameId -> summary (undefined = not started, '' = none yet)
function setEdge(id) {
  const el = document.getElementById('edgeSub-' + id);
  if (el && edgeText[id]) el.textContent = edgeText[id];
}
// Stream the edge angle so it types in as Ollama generates it. The fallback
// consensus line stays until the first token arrives (and if Ollama is down).
function streamEdge(id, onDone) {
  const done = onDone || (() => {});
  if (edgeText[id] !== undefined) { setEdge(id); done(); return; }
  edgeText[id] = '';
  let text = '';
  const es = new EventSource('/edge/' + id);
  es.onmessage = e => {
    if (e.data === '[DONE]') { es.close(); done(); return; }
    try {
      const c = JSON.parse(e.data);
      if (c.error) { es.close(); done(); }
      else if (c.text) { text += c.text; edgeText[id] = text; setEdge(id); }
    } catch (_) {}
  };
  es.onerror = () => { es.close(); done(); };
}

/* ---------- AI read (SSE /explain) ---------- */
// Buffer the streamed text per game so it survives in-place re-renders (e.g.
// toggling the inning view rebuilds the detail DOM). setExplain repaints the
// current box from the buffer; the stream is opened at most once per game.
const explainText = {};   // gameId -> latest text (undefined = not started)
function setExplain(gameId) {
  const box = document.getElementById('explain-' + gameId);
  if (box) box.textContent = explainText[gameId] || 'Reading the matchup…';
}
function streamExplanation(gameId) {
  if (explainText[gameId] !== undefined) { setExplain(gameId); return; }  // already streaming/done
  explainText[gameId] = '';   // mark started
  let text = '';
  const es = new EventSource('/explain/' + gameId);
  es.onmessage = e => {
    if (e.data === '[DONE]') { es.close(); return; }
    try {
      const c = JSON.parse(e.data);
      if (c.error) { explainText[gameId] = c.error; setExplain(gameId); es.close(); }
      else if (c.text) { text += c.text; explainText[gameId] = text; setExplain(gameId); }
    } catch (_) {}
  };
  es.onerror = () => { es.close(); if (!text) { explainText[gameId] = 'Could not reach the AI — make sure Ollama is running.'; setExplain(gameId); } };
}

render();

setInterval(() => {
  fetch('/api/games/today')
    .then(r => r.json())
    .then(data => {
      DATA.games = data.games;
      if (state.tab === 'salami') render(false);
    })
    .catch(() => {});
}, 60000);
</script>
