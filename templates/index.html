<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MLB Predictions — Edge</title>
<link rel="preconnect" href="https://a.espncdn.com">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; -webkit-font-smoothing: antialiased; background: #08090c; color: #eef0f4; }
  .num { font-variant-numeric: tabular-nums; }
  .app-scroll::-webkit-scrollbar { width: 0; }
  .tap { cursor: pointer; transition: background .12s, opacity .12s, color .12s; }
  .tap:hover { background: #13161d; }
  img.logo { object-fit: contain; flex-shrink: 0; display: inline-block; vertical-align: middle; }
  input, button { font-family: inherit; }
</style>
</head>
<body>
<script id="payload" type="application/json">{{ payload|tojson }}</script>

<div style="min-height:100vh;background:#08090c;display:flex;justify-content:center;">
  <div class="app-scroll" style="width:100%;max-width:540px;min-height:100vh;background:#0b0d11;border-left:1px solid #15181f;border-right:1px solid #15181f;display:flex;flex-direction:column;">

    <!-- HEADER -->
    <div id="appHeader" style="position:sticky;top:0;z-index:20;background:rgba(11,13,17,.86);backdrop-filter:blur(12px);border-bottom:1px solid #161a22;">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:18px 18px 0;">
        <div style="display:flex;align-items:baseline;gap:9px;">
          <span style="font:800 18px system-ui;color:#f1f3f6;letter-spacing:-.3px;">MLB Predictions</span>
          <span id="dateLabel" style="font:500 12px system-ui;color:#646a76;"></span>
        </div>
      </div>
      <div id="tabs"></div>
    </div>

    <div id="screen"></div>
  </div>
</div>

<!-- AI CHAT -->
<button id="fab" class="tap" style="position:fixed;right:24px;bottom:24px;z-index:80;display:flex;align-items:center;gap:7px;background:#3b82f6;color:#fff;border:none;border-radius:24px;padding:12px 18px;font:700 13px system-ui;box-shadow:0 6px 22px rgba(0,0,0,.5);">Ask AI</button>
<div id="chatWrap" style="display:none;">
  <div id="chatBackdrop" style="position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.45);"></div>
  <div style="position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:540px;height:80vh;z-index:91;background:#0b0d11;border:1px solid #1e222b;border-radius:18px 18px 0 0;display:flex;flex-direction:column;box-shadow:0 -12px 40px rgba(0,0,0,.55);">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid #161a22;">
      <div style="display:flex;align-items:baseline;gap:8px;">
        <span style="font:800 14px system-ui;color:#f1f3f6;">Ask Edge</span>
        <span style="font:500 11px system-ui;color:#646a76;">AI analyst</span>
      </div>
      <div id="chatClose" class="tap" style="font:600 20px system-ui;color:#8a909c;line-height:1;padding:0 4px;">×</div>
    </div>
    <div id="chatFocus" style="display:none;padding:8px 18px;font:600 11px system-ui;color:#3b82f6;background:#101722;border-bottom:1px solid #161a22;"></div>
    <div id="chatMsgs" class="app-scroll" style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;"></div>
    <form id="chatForm" style="display:flex;gap:8px;padding:12px;border-top:1px solid #161a22;">
      <input id="chatInput" autocomplete="off" placeholder="Ask about tonight's slate…" style="flex:1;background:#13161d;border:1px solid #222834;border-radius:10px;padding:10px 12px;color:#eef0f4;font:400 13px system-ui;outline:none;">
      <button type="submit" style="display:flex;align-items:center;justify-content:center;background:#3b82f6;color:#fff;border:none;border-radius:10px;padding:0 16px;font:700 12.5px system-ui;cursor:pointer;">Send</button>
    </form>
  </div>
</div>

<script>
const ACCENT = '#3b82f6', EDGE = '#34d399';
const DATA = JSON.parse(document.getElementById('payload').textContent);
const state = { tab: 'today', openId: null, sort: 'edge', innView: 'both', showLineups: false };

/* ---------- helpers ---------- */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function img(url, size) { return url ? `<img class="logo" src="${esc(url)}" alt="" loading="lazy" style="width:${size}px;height:${size}px;">` : ''; }
function fmtTime(utc) { if (!utc) return 'TBD'; const d = new Date(utc); if (isNaN(d.getTime())) return 'TBD'; return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
function gameById(id) { return DATA.games.find(g => g.id === id); }
function probToML(p) { p = Math.min(0.95, Math.max(0.04, p)); return p >= 0.5 ? '-' + Math.round(p / (1 - p) * 100) : '+' + Math.round((1 - p) / p * 100); }
function sortedGames() {
  const gs = [...DATA.games];
  gs.sort((a, b) => state.sort === 'time' ? (a.utc || '~').localeCompare(b.utc || '~') : (b.edgePct - a.edgePct));
  return gs;
}

/* ---------- header tabs ---------- */
function renderHeader() {
  document.getElementById('dateLabel').textContent = DATA.dateLabel || '';
  const tabsEl = document.getElementById('tabs');
  // In the game drill-down the tabs are hidden, so drop the header's bottom
  // border — otherwise it reads as a stray line under the title — and add a
  // little bottom padding the tab row would otherwise provide, so the sticky
  // header doesn't crowd the content scrolling beneath it.
  const hdr = document.getElementById('appHeader');
  const detail = state.openId !== null;
  hdr.style.borderBottom = detail ? 'none' : '1px solid #161a22';
  hdr.style.paddingBottom = detail ? '10px' : '0';
  if (detail) { tabsEl.innerHTML = ''; return; }
  const tab = (key, label) => {
    const on = state.tab === key;
    return `<div class="tap" data-tab="${key}" style="padding-bottom:11px;font:600 13.5px system-ui;color:${on ? '#f1f3f6' : '#5b616d'};border-bottom:2px solid ${on ? ACCENT : 'transparent'};">${label}</div>`;
  };
  tabsEl.innerHTML = `<div style="display:flex;gap:24px;padding:16px 18px 0;">${tab('today', 'Today')}${tab('track', 'Track Record')}${tab('settings', 'Settings')}</div>`;
  tabsEl.querySelectorAll('[data-tab]').forEach(el => el.onclick = () => { state.tab = el.dataset.tab; render(); });
}

/* ---------- TODAY ---------- */
function todayRow(g, edge) {
  if (edge) {
    return `<div class="tap" data-open="${g.id}" style="display:flex;align-items:center;gap:12px;padding:11px 8px;border-radius:12px;">
      <div class="num" style="min-width:52px;text-align:center;font:800 19px system-ui;color:${EDGE};letter-spacing:-.5px;">+${g.edgePct}%</div>
      <div style="flex:1;min-width:0;">
        <div style="display:flex;align-items:center;gap:7px;font:700 14px system-ui;color:#eef0f4;">${img(g.awayLogo, 19)}${esc(g.away)}<span style="color:#4d525d;font-weight:500;">@</span>${img(g.homeLogo, 19)}${esc(g.home)}</div>
        <div style="margin-top:3px;font:500 11.5px system-ui;color:#737a86;">Take <span style="color:#aeb4c0;font-weight:700;">${esc(g.pick)} ${g.pickPct}%</span> · proj ${esc(g.score)}</div>
      </div>
      <div style="text-align:right;flex-shrink:0;">
        <div class="num" style="font:600 11.5px system-ui;color:#7c828e;">${fmtTime(g.utc)}</div>
        <div style="margin-top:3px;font:600 11px system-ui;color:${ACCENT};">Detail ›</div>
      </div></div>`;
  }
  return `<div class="tap" data-open="${g.id}" style="display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:12px;opacity:.64;">
    <div style="min-width:52px;text-align:center;font:600 15px system-ui;color:#454a55;">—</div>
    <div style="flex:1;min-width:0;">
      <div style="display:flex;align-items:center;gap:7px;font:700 13.5px system-ui;color:#c2c6cf;">${img(g.awayLogo, 18)}${esc(g.away)}<span style="color:#4d525d;font-weight:500;">@</span>${img(g.homeLogo, 18)}${esc(g.home)}</div>
      <div style="margin-top:2px;font:500 11px system-ui;color:#646a76;">Lean ${esc(g.pick)} ${g.pickPct}% · proj ${esc(g.score)}</div>
    </div>
    <div class="num" style="font:600 11px system-ui;color:#646a76;flex-shrink:0;">${fmtTime(g.utc)}</div></div>`;
}
function renderToday() {
  const gs = sortedGames();
  const edges = gs.filter(g => g.hasEdge), none = gs.filter(g => !g.hasEdge);
  const seg = (on, key, label) => `<div class="tap" data-sort="${key}" style="padding:4px 10px;border-radius:6px;font:600 11px system-ui;color:${on ? '#f1f3f6' : '#646a76'};background:${on ? '#222834' : 'transparent'};">${label}</div>`;
  let html = `<div style="padding:0 10px 40px;">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 8px 6px;">
      <div style="display:flex;align-items:center;gap:7px;color:#6b7280;font:500 11.5px system-ui;">
        <span style="width:6px;height:6px;border-radius:50%;background:${EDGE};display:inline-block;"></span>
        <span style="color:#cfd3da;font-weight:700;">${DATA.accAccuracy}% hit rate on moneyline</span>&nbsp;last 7 days
      </div>
      <div style="display:flex;background:#13161d;border:1px solid #1e222b;border-radius:8px;padding:2px;">${seg(state.sort === 'edge', 'edge', 'Edge')}${seg(state.sort === 'time', 'time', 'Time')}</div>
    </div>`;
  if (!gs.length) {
    html += `<div style="padding:40px 12px;text-align:center;color:#646a76;font:500 13px system-ui;">No games scheduled today.</div>`;
  } else {
    html += `<div style="font:700 10px system-ui;letter-spacing:1.4px;color:#565c68;text-transform:uppercase;padding:8px 8px 6px;">Best edges today</div>`;
    html += edges.length ? edges.map(g => todayRow(g, true)).join('') : `<div style="padding:6px 10px;color:#565c68;font:500 12px system-ui;">No edges vs the market today.</div>`;
    if (none.length) {
      html += `<div style="font:700 10px system-ui;letter-spacing:1.4px;color:#3f444e;text-transform:uppercase;padding:18px 8px 6px;">No edge — model agrees with market</div>`;
      html += none.map(g => todayRow(g, false)).join('');
    }
  }
  html += `</div>`;
  return html;
}

/* ---------- TRACK RECORD ---------- */
function renderTrack() {
  const t = DATA.track;
  const card = s => `<div style="background:#11141a;border:1px solid #1e222b;border-radius:13px;padding:14px;">
    <div style="font:600 10.5px system-ui;color:#646a76;text-transform:uppercase;letter-spacing:.6px;">${esc(s.label)}</div>
    <div class="num" style="font:800 26px system-ui;color:${s.good ? '#4caf50' : '#e8e8e8'};margin-top:8px;letter-spacing:-1px;">${s.acc}%</div>
    <div style="font:500 11px system-ui;color:#737a86;margin-top:3px;">${s.games} games${s.err != null ? ' · ±' + s.err + ' runs' : ''}</div>
    <div style="font:500 10px system-ui;color:#565c68;margin-top:3px;">Consensus${s.model != null ? ' · model ' + s.model + '%' : ''}</div></div>`;
  const yrow = y => `<div style="display:flex;align-items:center;gap:12px;padding:11px 4px;border-top:1px solid #161a21;">
    <div style="flex:1;min-width:0;display:flex;align-items:center;gap:6px;font:700 13px system-ui;color:#e3e6eb;">${img(y.awayLogo, 18)}${esc(y.away)}<span style="color:#4d525d;font-weight:500;">@</span>${img(y.homeLogo, 18)}${esc(y.home)}</div>
    <div style="text-align:right;"><div class="num" style="font:700 13px system-ui;color:#dfe2e8;">${esc(y.actual)}</div><div style="font:500 10px system-ui;color:#646a76;margin-top:1px;">pick ${esc(y.pick)}</div></div>
    <div style="min-width:54px;text-align:center;"><span style="font:800 10.5px system-ui;padding:3px 9px;border-radius:20px;color:${y.win ? '#4caf50' : '#ef5350'};background:${y.win ? 'rgba(76,175,80,.14)' : 'rgba(239,83,80,.14)'};">${y.win ? '✓ HIT' : '✗ MISS'}</span></div></div>`;
  const drow = d => `<div style="display:flex;align-items:center;gap:12px;padding:8px 4px;">
    <div style="width:54px;font:500 11.5px system-ui;color:#9aa0ac;">${esc(d.date)}</div>
    <div style="width:62px;font:500 11px system-ui;color:#646a76;">${d.n} games</div>
    <div style="flex:1;height:7px;border-radius:4px;background:#15181f;overflow:hidden;"><div style="height:100%;width:${d.acc}%;background:${d.acc >= 60 ? '#4caf50' : '#5a6270'};border-radius:4px;"></div></div>
    <div class="num" style="width:38px;text-align:right;font:700 12px system-ui;color:${d.acc >= 60 ? '#4caf50' : '#c2c6cf'};">${d.acc}%</div></div>`;
  let html = `<div style="padding:16px 16px 40px;">
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:20px;">${t.summary.map(card).join('')}</div>
    <div style="font:700 10px system-ui;letter-spacing:1.4px;color:#565c68;text-transform:uppercase;padding:0 2px 8px;">Yesterday · ${esc(t.yDate)}</div>`;
  html += t.yesterday.length ? t.yesterday.map(yrow).join('') : `<div style="padding:6px 4px;color:#565c68;font:500 12px system-ui;">No graded games yet.</div>`;
  html += `<div style="font:700 10px system-ui;letter-spacing:1.4px;color:#565c68;text-transform:uppercase;padding:22px 2px 8px;">Daily accuracy · last 7 days</div>`;
  html += t.daily.length ? t.daily.map(drow).join('') : `<div style="padding:6px 4px;color:#565c68;font:500 12px system-ui;">Building history…</div>`;
  html += `</div>`;
  return html;
}

/* ---------- SETTINGS ---------- */
function renderSettings() {
  const m = DATA.model;
  const years = (m.years && m.years.length) ? ` (${m.years[0]}–${m.years[m.years.length - 1]})` : '';
  return `<div style="padding:18px 18px 40px;">
    <div style="font:700 10px system-ui;letter-spacing:1.4px;color:#565c68;text-transform:uppercase;padding:0 2px 10px;">Data</div>
    <div style="background:#11141a;border:1px solid #1e222b;border-radius:14px;padding:16px;margin-bottom:18px;">
      <div style="font:600 13px system-ui;color:#eef0f4;">Predictions &amp; results</div>
      <div style="font:500 11.5px system-ui;color:#737a86;margin-top:5px;line-height:1.55;">Pulls today's slate, odds and final scores from the MLB Stats API and sportsbooks, then re-runs the simulation.</div>
      <form method="post" action="/refresh" onsubmit="this.querySelector('button').textContent='Refreshing…';this.querySelector('button').style.opacity=.6;">
        <button type="submit" style="margin-top:13px;width:100%;border:none;display:flex;align-items:center;justify-content:center;padding:11px;border-radius:10px;background:${ACCENT};color:#fff;font:700 12.5px system-ui;cursor:pointer;">Refresh data</button>
      </form>
    </div>
    <div style="font:700 10px system-ui;letter-spacing:1.4px;color:#565c68;text-transform:uppercase;padding:0 2px 10px;">Model</div>
    <div style="background:#11141a;border:1px solid #1e222b;border-radius:14px;padding:16px;margin-bottom:18px;">
      <div style="font:600 13px system-ui;color:#eef0f4;">${esc(m.name)} · XGBoost + Monte Carlo</div>
      <div style="font:500 11.5px system-ui;color:#737a86;margin-top:5px;line-height:1.55;">Trained on ${esc(m.nGames)} games${years}. Retraining refits on the latest results and forks a new model version — it can take a few minutes.</div>
      <form method="post" action="/retrain" onsubmit="this.querySelector('button').textContent='Retraining…';this.querySelector('button').style.opacity=.6;">
        <button type="submit" style="margin-top:13px;width:100%;display:flex;align-items:center;justify-content:center;padding:11px;border-radius:10px;background:#222834;color:#cdd2da;font:700 12.5px system-ui;border:1px solid #222834;cursor:pointer;">Retrain model</button>
      </form>
    </div>
    <div style="font:700 10px system-ui;letter-spacing:1.4px;color:#565c68;text-transform:uppercase;padding:0 2px 10px;">More</div>
    <a href="/archive" style="text-decoration:none;display:block;background:#11141a;border:1px solid #1e222b;border-radius:14px;padding:14px 16px;">
      <div style="display:flex;align-items:center;justify-content:space-between;"><span style="font:600 13px system-ui;color:#eef0f4;">Model archive</span><span style="font:600 12px system-ui;color:${ACCENT};">Open ›</span></div>
      <div style="font:500 11.5px system-ui;color:#737a86;margin-top:5px;">Accuracy of every past model version, graded against real finals.</div>
    </a>
  </div>`;
}

/* ---------- GAME DETAIL ---------- */
function distRow(abbr, logo, counts, labels, color) {
  const n = Math.min(labels.length, 13);
  const slice = counts.slice(0, n);
  const max = Math.max(1, ...slice);
  const modal = slice.indexOf(Math.max(...slice));
  const total = slice.reduce((a, b) => a + b, 0) || 1;
  const bars = slice.map((c, k) => `<div title="${labels[k]} runs · ${Math.round(c / total * 100)}%" style="flex:1;height:${Math.max(3, c / max * 100)}%;min-height:2px;background:${k === modal ? color : color + '66'};border-radius:2px;"></div>`).join('');
  return `<div style="display:flex;align-items:flex-end;gap:8px;margin-bottom:10px;">
    <div style="width:42px;display:flex;align-items:center;gap:5px;font:700 12px system-ui;color:#dfe2e8;">${img(logo, 16)}${esc(abbr)}</div>
    <div style="flex:1;display:flex;align-items:flex-end;gap:3px;height:48px;">${bars}</div></div>`;
}
function renderDetail() {
  const g = gameById(state.openId);
  if (!g) { state.openId = null; return renderToday(); }
  const betPctColor = g.hasEdge ? EDGE : '#7c828e';
  const betHeadline = g.hasEdge ? `+${g.edgePct}%` : '—';
  const betLine = g.hasEdge ? `Take ${esc(g.pick)} moneyline` : `Lean ${esc(g.pick)}, no edge`;
  const betSub = g.hasEdge ? `Consensus has ${esc(g.pick)} at ${g.pickPct}% vs the market line` : `Model and market agree — pass on a bet`;
  const labels = g.scoreDist.labels || [];
  const n = Math.min(labels.length, 13);
  const axis = labels.slice(0, n).map(k => `<div class="num" style="flex:1;text-align:center;font:500 8.5px system-ui;color:#5a606b;">${k}</div>`).join('');

  // inning moneyline table
  const inn = g.innings[state.innView] || [];
  const innRows = inn.map((c, i) => `<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid #15181f;">
    <div style="width:40px;font:700 11px system-ui;color:#9aa0ac;">${i + 1}</div>
    <div class="num" style="flex:1;text-align:right;font:600 12px system-ui;color:#cfd3da;">${probToML((c[0] || 0) / 100)}</div>
    <div class="num" style="flex:1;text-align:right;font:600 12px system-ui;color:#cfd3da;">${probToML((c[1] || 0) / 100)}</div>
    <div class="num" style="flex:1;text-align:right;font:700 12px system-ui;color:#aecbff;">${probToML((c[2] || 0) / 100)}</div></div>`).join('');
  const innSeg = (on, key, label) => `<div class="tap" data-inn="${key}" style="padding:3px 10px;border-radius:6px;font:600 10.5px system-ui;color:${on ? '#f1f3f6' : '#646a76'};background:${on ? '#222834' : 'transparent'};">${esc(label)}</div>`;

  const lineHtml = (arr) => arr.length ? arr.map((name, i) => `<div style="display:flex;gap:8px;padding:6px 8px;border-bottom:1px solid #15181f;font:500 12px system-ui;color:#c2c6cf;"><span style="color:#4d525d;">${i + 1}</span>${esc(name)}</div>`).join('') : `<div style="padding:6px 8px;font:500 12px system-ui;color:#565c68;">Not posted yet</div>`;

  return `<div style="padding:0 0 48px;">
    <div id="detailBack" class="tap" style="display:flex;align-items:center;gap:6px;padding:14px 18px 10px;font:600 12.5px system-ui;color:#8a909c;">‹ Back to today</div>

    <div style="padding:4px 18px 0;">
      <div style="background:linear-gradient(150deg,${g.awayTint} 0%,#0f1217 46%,#0f1217 60%,${g.homeTint} 100%);border:1px solid #1d212a;border-radius:16px;padding:18px;">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <div style="display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;">${img(g.awayLogo, 46)}<span style="font:800 15px system-ui;color:#eef0f4;">${esc(g.away)}</span><span style="font:600 9px system-ui;color:#5a606b;text-transform:uppercase;letter-spacing:.5px;">Away</span><span style="font:600 11px system-ui;color:#aab0bc;text-align:center;">${esc(g.awayP)}</span></div>
          <div style="text-align:center;padding:0 12px;"><div class="num" style="font:800 30px system-ui;color:#f1f3f6;letter-spacing:1px;white-space:nowrap;">${esc(g.score)}</div><div style="font:600 9px system-ui;color:#5a606b;text-transform:uppercase;letter-spacing:1px;margin-top:2px;">projected</div><div class="num" style="font:500 11px system-ui;color:#7c828e;margin-top:7px;">${fmtTime(g.utc)}</div></div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;">${img(g.homeLogo, 46)}<span style="font:800 15px system-ui;color:#eef0f4;">${esc(g.home)}</span><span style="font:600 9px system-ui;color:#5a606b;text-transform:uppercase;letter-spacing:.5px;">Home</span><span style="font:600 11px system-ui;color:#aab0bc;text-align:center;">${esc(g.homeP)}</span></div>
        </div>
        <div style="margin-top:16px;">
          <div style="display:flex;justify-content:space-between;font:700 11.5px system-ui;margin-bottom:5px;"><span class="num" style="color:#dfe2e8;">${g.awayPct}%</span><span style="color:#646a76;font-weight:500;">win probability</span><span class="num" style="color:#dfe2e8;">${g.homePct}%</span></div>
          <div style="height:8px;border-radius:5px;overflow:hidden;display:flex;background:#0a0c10;"><div style="width:${g.awayPct}%;background:${g.awayColor};"></div><div style="width:${g.homePct}%;background:${g.homeColor};"></div></div>
        </div>
      </div>
    </div>

    <div style="padding:16px 18px 0;">
      <div style="font:700 10px system-ui;letter-spacing:1.4px;color:#565c68;text-transform:uppercase;padding:0 2px 8px;">The bet</div>
      <div style="background:#11141a;border:1px solid ${g.hasEdge ? 'rgba(52,211,153,.3)' : '#1e222b'};border-radius:14px;overflow:hidden;">
        <div style="display:flex;align-items:center;gap:14px;padding:15px 16px;background:${g.hasEdge ? 'rgba(52,211,153,.08)' : 'transparent'};">
          <div class="num" style="font:800 30px system-ui;color:${betPctColor};letter-spacing:-1px;">${betHeadline}</div>
          <div style="flex:1;"><div style="font:700 14px system-ui;color:#eef0f4;">${betLine}</div><div style="font:500 11.5px system-ui;color:#737a86;margin-top:2px;">${betSub}</div></div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid #1c2029;">
          <div style="padding:11px 14px;border-right:1px solid #1c2029;"><div style="font:600 9.5px system-ui;color:#646a76;text-transform:uppercase;letter-spacing:.6px;">Model</div><div class="num" style="font:700 13px system-ui;color:#aecbff;margin-top:4px;">${esc(g.pick)} ${esc(g.modelML || '—')}</div></div>
          <div style="padding:11px 14px;border-right:1px solid #1c2029;"><div style="font:600 9.5px system-ui;color:#646a76;text-transform:uppercase;letter-spacing:.6px;">Market</div><div class="num" style="font:700 13px system-ui;color:#e6ad62;margin-top:4px;">${esc(g.pick)} ${esc(g.marketML || '—')}</div></div>
          <div style="padding:11px 14px;"><div style="font:600 9.5px system-ui;color:#646a76;text-transform:uppercase;letter-spacing:.6px;">Edge</div><div class="num" style="font:700 13px system-ui;color:${g.hasEdge ? EDGE : '#646a76'};margin-top:4px;">${g.hasEdge ? '+' + g.edgePct + '%' : 'none'}</div></div>
        </div>
      </div>
    </div>

    <div style="padding:18px 18px 0;">
      <div style="font:700 10px system-ui;letter-spacing:1.4px;color:#565c68;text-transform:uppercase;padding:0 2px 10px;">Run distribution <span style="color:#3f444e;">— how many runs each team scores</span></div>
      <div style="background:#11141a;border:1px solid #1e222b;border-radius:14px;padding:14px 14px 10px;">
        ${distRow(g.away, g.awayLogo, g.scoreDist.away, labels, g.awayColor)}
        ${distRow(g.home, g.homeLogo, g.scoreDist.home, labels, g.homeColor)}
        <div style="display:flex;align-items:center;gap:8px;"><div style="width:42px;"></div><div style="flex:1;display:flex;gap:3px;">${axis}</div></div>
        <div style="font:500 10px system-ui;color:#5a606b;text-align:center;padding-top:8px;">runs scored · ${(g.nSims || 0).toLocaleString()} simulations · tallest bar = most likely</div>
      </div>
    </div>

    <div style="padding:18px 18px 0;">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:0 2px 10px;gap:10px;">
        <span style="font:700 10px system-ui;letter-spacing:1.4px;color:#565c68;text-transform:uppercase;">Inning moneylines</span>
        <div style="display:flex;background:#13161d;border:1px solid #1e222b;border-radius:8px;padding:2px;">${innSeg(state.innView === 'away', 'away', g.away)}${innSeg(state.innView === 'home', 'home', g.home)}${innSeg(state.innView === 'both', 'both', 'Both')}</div>
      </div>
      <div style="background:#11141a;border:1px solid #1e222b;border-radius:14px;padding:6px 14px 8px;">
        <div style="display:flex;align-items:center;gap:8px;padding:8px 0;"><div style="width:40px;font:600 9.5px system-ui;color:#646a76;text-transform:uppercase;letter-spacing:.6px;">Inn</div><div style="flex:1;text-align:right;font:600 9.5px system-ui;color:#646a76;text-transform:uppercase;letter-spacing:.6px;">0 runs</div><div style="flex:1;text-align:right;font:600 9.5px system-ui;color:#646a76;text-transform:uppercase;letter-spacing:.6px;">1 run</div><div style="flex:1;text-align:right;font:600 9.5px system-ui;color:#646a76;text-transform:uppercase;letter-spacing:.6px;">2+ runs</div></div>
        ${innRows || '<div style="padding:8px 0;color:#565c68;font:500 12px system-ui;">No inning data.</div>'}
        <div style="font:500 10px system-ui;color:#5a606b;text-align:center;padding-top:8px;">fair moneyline to score exactly 0 / 1 / 2+ runs in each inning</div>
      </div>
    </div>

    <div style="padding:18px 18px 0;">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <div style="background:#11141a;border:1px solid #1e222b;border-radius:12px;padding:12px 14px;"><div style="font:600 9.5px system-ui;color:#646a76;text-transform:uppercase;letter-spacing:.6px;">Probable starters</div><div style="font:600 12.5px system-ui;color:#dfe2e8;margin-top:7px;">${esc(g.awayP)} <span style="color:#646a76;font-weight:500;">(${esc(g.away)})</span></div><div style="font:600 12.5px system-ui;color:#dfe2e8;margin-top:4px;">${esc(g.homeP)} <span style="color:#646a76;font-weight:500;">(${esc(g.home)})</span></div></div>
        <div style="background:#11141a;border:1px solid #1e222b;border-radius:12px;padding:12px 14px;"><div style="font:600 9.5px system-ui;color:#646a76;text-transform:uppercase;letter-spacing:.6px;">Venue</div><div style="font:600 12.5px system-ui;color:#dfe2e8;margin-top:7px;">${esc(g.venue || '—')}</div><div style="font:500 11.5px system-ui;color:#9aa0ac;margin-top:4px;">${esc(g.weather)}</div></div>
      </div>
    </div>

    <div style="padding:18px 18px 0;">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:0 2px 8px;"><span style="font:700 10px system-ui;letter-spacing:1.4px;color:#565c68;text-transform:uppercase;">AI read</span><div id="detailDiscuss" class="tap" style="font:600 11px system-ui;color:${ACCENT};">Discuss ›</div></div>
      <div id="explain-${g.id}" style="background:#0f1217;border:1px solid #1c2029;border-radius:14px;padding:15px 16px;font:400 13px/1.65 system-ui;color:#aab0bc;">Reading the matchup…</div>
    </div>

    <div style="padding:18px 18px 0;">
      <div id="lineupToggle" class="tap" style="display:flex;align-items:center;justify-content:space-between;padding:13px 16px;background:#11141a;border:1px solid #1e222b;border-radius:12px;"><span style="font:700 12px system-ui;color:#dfe2e8;">Projected lineups</span><span style="font:600 12px system-ui;color:${ACCENT};">${state.showLineups ? 'Hide' : 'Show'}</span></div>
      ${state.showLineups ? `<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px;">
        <div><div style="font:700 10px system-ui;color:#646a76;text-transform:uppercase;letter-spacing:.6px;padding:0 2px 6px;">${esc(g.away)}</div>${lineHtml(g.awayLineup)}</div>
        <div><div style="font:700 10px system-ui;color:#646a76;text-transform:uppercase;letter-spacing:.6px;padding:0 2px 6px;">${esc(g.home)}</div>${lineHtml(g.homeLineup)}</div>
      </div>` : ''}
    </div>
  </div>`;
}

/* ---------- main render ---------- */
// scrollTop=true on navigation (tab switch, open/close game); pass false for
// in-place toggles (inning view, lineups, sort) so the page doesn't jump.
function render(scrollTop = true) {
  const y = window.scrollY;   // preserve position across in-place re-renders
  renderHeader();
  const screen = document.getElementById('screen');
  if (state.openId !== null) {
    screen.innerHTML = renderDetail();
    wireDetail();
    setExplain(state.openId);   // restore the AI read after the DOM is rebuilt
  } else if (state.tab === 'today') {
    screen.innerHTML = renderToday();
    screen.querySelectorAll('[data-open]').forEach(el => el.onclick = () => openGame(+el.dataset.open));
    screen.querySelectorAll('[data-sort]').forEach(el => el.onclick = () => { state.sort = el.dataset.sort; render(false); });
  } else if (state.tab === 'track') {
    screen.innerHTML = renderTrack();
  } else {
    screen.innerHTML = renderSettings();
  }
  window.scrollTo(0, scrollTop ? 0 : y);
}
function openGame(id) { state.openId = id; state.showLineups = false; state.innView = 'both'; render(); streamExplanation(id); }
function wireDetail() {
  const g = gameById(state.openId);
  document.getElementById('detailBack').onclick = () => { state.openId = null; render(); };
  document.getElementById('lineupToggle').onclick = () => { state.showLineups = !state.showLineups; render(false); };
  document.getElementById('detailDiscuss').onclick = () => discussGame(g.id, `${g.away} @ ${g.home}`);
  document.querySelectorAll('[data-inn]').forEach(el => el.onclick = () => { state.innView = el.dataset.inn; render(false); });
}

/* ---------- AI read (SSE /explain) ---------- */
// Buffer the streamed text per game so it survives in-place re-renders (e.g.
// toggling the inning view rebuilds the detail DOM). setExplain repaints the
// current box from the buffer; the stream is opened at most once per game.
const explainText = {};   // gameId -> latest text (undefined = not started)
function setExplain(gameId) {
  const box = document.getElementById('explain-' + gameId);
  if (box) box.textContent = explainText[gameId] || 'Reading the matchup…';
}
function streamExplanation(gameId) {
  if (explainText[gameId] !== undefined) { setExplain(gameId); return; }  // already streaming/done
  explainText[gameId] = '';   // mark started
  let text = '';
  const es = new EventSource('/explain/' + gameId);
  es.onmessage = e => {
    if (e.data === '[DONE]') { es.close(); return; }
    try {
      const c = JSON.parse(e.data);
      if (c.error) { explainText[gameId] = c.error; setExplain(gameId); es.close(); }
      else if (c.text) { text += c.text; explainText[gameId] = text; setExplain(gameId); }
    } catch (_) {}
  };
  es.onerror = () => { es.close(); if (!text) { explainText[gameId] = 'Could not reach the AI — make sure Ollama is running.'; setExplain(gameId); } };
}

/* ---------- chat (fetch stream /chat) ---------- */
let chatMessages = [], chatFocus = null, chatBusy = false;
const fab = document.getElementById('fab'), chatWrap = document.getElementById('chatWrap');
function openChat() { chatWrap.style.display = 'block'; fab.style.display = 'none'; renderChat(); document.getElementById('chatInput').focus(); }
function closeChat() { chatWrap.style.display = 'none'; fab.style.display = 'flex'; }
fab.onclick = () => { chatFocus = null; document.getElementById('chatFocus').style.display = 'none'; openChat(); };
document.getElementById('chatClose').onclick = closeChat;
document.getElementById('chatBackdrop').onclick = closeChat;
function discussGame(id, label) {
  chatFocus = { id, label };
  const fb = document.getElementById('chatFocus');
  fb.style.display = 'block'; fb.textContent = 'Focused on ' + label;
  openChat();
  chatSend('Give me a quick rundown of this game and the biggest edge the model sees vs the market.');
}
function renderChat() {
  const box = document.getElementById('chatMsgs');
  if (!chatMessages.length) {
    box.innerHTML = `<div style="margin:auto;text-align:center;max-width:280px;"><div style="font:600 13px system-ui;color:#8b93a3;line-height:1.5;">Ask about tonight's edges, a matchup, or pitching.</div><div style="font:500 11.5px system-ui;color:#5a606b;margin-top:8px;line-height:1.6;">e.g. "What's the best bet tonight?" · "Why do you like the Mets?"</div></div>`;
    return;
  }
  box.innerHTML = '';
  for (const m of chatMessages) {
    const user = m.role === 'user';
    const d = document.createElement('div');
    d.style.cssText = `align-self:${user ? 'flex-end' : 'flex-start'};max-width:84%;background:${user ? '#1d3a59' : '#161b22'};border:1px solid ${user ? 'transparent' : '#222834'};color:${user ? '#eaf2ff' : '#cdd2da'};font:400 13px/1.55 system-ui;padding:9px 12px;border-radius:12px;white-space:pre-wrap;`;
    d.textContent = m.content || '…';
    box.appendChild(d);
  }
  box.scrollTop = box.scrollHeight;
}
document.getElementById('chatForm').onsubmit = e => {
  e.preventDefault();
  const inp = document.getElementById('chatInput');
  const t = inp.value.trim();
  if (t && !chatBusy) { inp.value = ''; chatSend(t); }
};
async function chatSend(text) {
  if (chatBusy) return;
  chatBusy = true;
  chatMessages.push({ role: 'user', content: text });
  const bot = { role: 'assistant', content: '' };
  chatMessages.push(bot);
  renderChat();
  try {
    const resp = await fetch('/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: chatMessages.slice(0, -1), game_id: chatFocus ? chatFocus.id : null }),
    });
    const reader = resp.body.getReader(), dec = new TextDecoder();
    while (true) { const { done, value } = await reader.read(); if (done) break; bot.content += dec.decode(value, { stream: true }); renderChat(); }
    if (!bot.content) { bot.content = 'No response — is Ollama running?'; renderChat(); }
  } catch (err) { bot.content = 'Error: ' + err; renderChat(); }
  finally { chatBusy = false; }
}

render();
</script>
